name: Build Game for Itch

# Runs on every push to main, and can also be triggered manually from
# the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

# Needed so this workflow can publish a GitHub Release with the built zip.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repo uses Bun (bun.lock / bunfig.toml), not npm — there is
      # no package-lock.json/yarn.lock, so actions/setup-node's npm
      # cache option fails with "Dependencies lock file is not found".
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The default build here targets Cloudflare Workers (see
      # .output/server/wrangler.json) — the HTML is generated by a
      # server at request time, so there is no static HTML at all in
      # that output. itch.io only serves static files, no server.
      # NITRO_PRESET=static switches Nitro to its static preset AND
      # (via vite.config.ts) turns on TanStack Start's dedicated SPA
      # mode, which prerenders a real static shell instead of relying
      # on generic route-crawling (which doesn't work here since the
      # app has no server-renderable "/" response to crawl).
      # This only affects this CI build — the normal Cloudflare deploy
      # config is untouched.
      - name: Build project (static preset for itch.io)
        env:
          NITRO_PRESET: static
        run: bun run build

      # SPA mode writes the prerendered shell as "_shell.html", not
      # "index.html" — itch.io specifically needs an index.html entry
      # point, so locate whichever exists and normalize it.
      - name: Locate build output and normalize entry file
        id: find_output
        run: |
          CANDIDATE=$(find . -maxdepth 5 \
            -not -path "./node_modules/*" -not -path "./.git/*" \
            \( -name "index.html" -o -name "_shell.html" \) | head -n 1)
          if [ -z "$CANDIDATE" ]; then
            echo "::error::Could not find index.html or _shell.html anywhere in the build output."
            echo "Full output tree after build:"
            find .output . -maxdepth 5 \
              -not -path "./node_modules/*" -not -path "./.git/*" 2>/dev/null
            exit 1
          fi
          OUT=$(dirname "$CANDIDATE")
          echo "Found build output at: $OUT (entry file: $(basename "$CANDIDATE"))"
          if [ ! -f "$OUT/index.html" ]; then
            cp "$OUT/_shell.html" "$OUT/index.html"
            echo "Copied _shell.html -> index.html for itch.io compatibility"
          fi
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      # Upload the raw output FOLDER, not a pre-made .zip.
      # GitHub's Artifacts UI always adds exactly one zip layer on
      # download. Feed it a folder and that one layer is the ONLY zip,
      # so index.html lands right at the root — download this artifact
      # from the Actions tab and upload it to itch.io with zero extra
      # unzipping.
      - name: Upload playable game folder
        uses: actions/upload-artifact@v4
        with:
          name: itch-game
          path: ${{ steps.find_output.outputs.dir }}

      # There is no "build:itch" script in package.json, so zip the
      # already-located output folder directly instead of depending on one.
      - name: Zip build for itch.io
        run: |
          mkdir -p releases
          cd "${{ steps.find_output.outputs.dir }}"
          zip -r "$GITHUB_WORKSPACE/releases/velocity-visions-itch.zip" .

      # Alternative download method: a GitHub Release with the zip
      # attached as a release asset. Release assets download as the
      # exact raw file with no extra wrapping either, so this is just
      # as safe to upload straight to itch.io as the folder artifact
      # above — pick whichever is more convenient.
      - name: Publish latest build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest itch.io build
          body: Automatically rebuilt from the latest push to main. Download the .zip below and upload it directly to itch.io.
          make_latest: true
          files: releases/velocity-visions-itch.zip
