name: Build Game for Itch

# Runs on every push to main, and can also be triggered manually from
# the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

# Needed so this workflow can publish a GitHub Release with the built zip.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repo uses Bun (bun.lock / bunfig.toml), not npm — there is
      # no package-lock.json/yarn.lock, so actions/setup-node's npm
      # cache option fails with "Dependencies lock file is not found".
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      # The build output folder isn't reliably "dist" for this
      # TanStack Start / nitro setup, so find wherever the built
      # index.html actually landed instead of hardcoding a path.
      - name: Locate build output
        id: find_output
        run: |
          OUT=$(find . -maxdepth 4 \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -name "index.html" | head -n 1 | xargs -r dirname)
          if [ -z "$OUT" ]; then
            echo "::error::Could not find index.html anywhere in the build output."
            echo "Top-level files after build:"
            find . -maxdepth 3 -not -path "./node_modules/*" -not -path "./.git/*"
            exit 1
          fi
          echo "Found build output at: $OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      # Upload the raw output FOLDER, not a pre-made .zip.
      # GitHub's Artifacts UI always adds exactly one zip layer on
      # download. Feed it a folder and that one layer is the ONLY zip,
      # so index.html lands right at the root — download this artifact
      # from the Actions tab and upload it to itch.io with zero extra
      # unzipping.
      - name: Upload playable game folder
        uses: actions/upload-artifact@v4
        with:
          name: itch-game
          path: ${{ steps.find_output.outputs.dir }}

      # There is no "build:itch" script in package.json, so zip the
      # already-located output folder directly instead of depending on one.
      - name: Zip build for itch.io
        run: |
          mkdir -p releases
          cd "${{ steps.find_output.outputs.dir }}"
          zip -r "$GITHUB_WORKSPACE/releases/velocity-visions-itch.zip" .

      # Alternative download method: a GitHub Release with the zip
      # attached as a release asset. Release assets download as the
      # exact raw file with no extra wrapping either, so this is just
      # as safe to upload straight to itch.io as the folder artifact
      # above — pick whichever is more convenient.
      - name: Publish latest build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest itch.io build
          body: Automatically rebuilt from the latest push to main. Download the .zip below and upload it directly to itch.io.
          make_latest: true
          files: releases/velocity-visions-itch.zip
