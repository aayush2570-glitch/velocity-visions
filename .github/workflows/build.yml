name: Build Game for Itch

# Runs on every push to main, and can also be triggered manually from
# the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

# Needed so this workflow can publish a GitHub Release with the built zip.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repo uses Bun (bun.lock / bunfig.toml), not npm.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The normal "bun run build" targets Cloudflare Workers via
      # TanStack Start + Nitro — that build has no static HTML at all
      # (the page is rendered server-side per request), and forcing
      # Nitro's static/SPA prerender modes hit upstream bugs in this
      # exact TanStack Start + Nitro combo (generic route crawler
      # 404s on "/", every time, regardless of preset).
      #
      # So this uses a separate, minimal vite.itch.config.ts (no
      # TanStack Start plugin, no Nitro) that mounts the same
      # router/game client-side only, straight into a plain
      # index.html. Zero server, zero prerender step, guaranteed
      # static output — exactly what itch.io needs.
      - name: Build static SPA for itch.io
        run: bunx vite build --config vite.itch.config.ts

      - name: Verify build output
        run: |
          if [ ! -f dist-itch/index.html ]; then
            echo "::error::dist-itch/index.html was not produced."
            find dist-itch 2>/dev/null
            exit 1
          fi
          echo "Build output:"
          find dist-itch -maxdepth 2

      # Upload the raw output FOLDER, not a pre-made .zip.
      # GitHub's Artifacts UI always adds exactly one zip layer on
      # download. Feed it a folder and that one layer is the ONLY zip,
      # so index.html lands right at the root — download this artifact
      # from the Actions tab and upload it to itch.io with zero extra
      # unzipping.
      - name: Upload playable game folder
        uses: actions/upload-artifact@v4
        with:
          name: itch-game
          path: dist-itch

      - name: Zip build for itch.io
        run: |
          mkdir -p releases
          cd dist-itch
          zip -r ../releases/velocity-visions-itch.zip .

      # Alternative download method: a GitHub Release with the zip
      # attached as a release asset. Release assets download as the
      # exact raw file with no extra wrapping either, so this is just
      # as safe to upload straight to itch.io as the folder artifact
      # above — pick whichever is more convenient.
      - name: Publish latest build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest itch.io build
          body: Automatically rebuilt from the latest push to main. Download the .zip below and upload it directly to itch.io.
          make_latest: true
          files: releases/velocity-visions-itch.zip
